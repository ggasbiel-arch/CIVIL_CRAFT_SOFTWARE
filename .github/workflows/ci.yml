name: Windows preview build
on:
  push:
    branches: [codex/windows-preview-build]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9dbdc25453c4d76b3326504d23d765b44c280f61
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - run: cargo build --locked -p civil_desktop --target x86_64-pc-windows-msvc
      - uses: actions/upload-artifact@v4
        with:
          name: CIVIL-CRAFT-CAD-BIM-9dbdc25-Windows-x64
          path: target/x86_64-pc-windows-msvc/debug/civil_desktop.exe
          if-no-files-found: error
