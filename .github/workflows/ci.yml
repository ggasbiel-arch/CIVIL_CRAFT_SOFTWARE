name: Windows preview build
on:
  push:
    branches: [codex/windows-preview-build]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    env:
      CARGO_PROFILE_RELEASE_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2f4e84f8facf4195ffba8a66e2adb6b2b4957b92
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - run: cargo build --locked --release -p civil_desktop --target x86_64-pc-windows-msvc
      - uses: actions/upload-artifact@v4
        with:
          name: civil-craft-win-x64
          path: target/x86_64-pc-windows-msvc/release/civil_desktop.exe
          if-no-files-found: error
